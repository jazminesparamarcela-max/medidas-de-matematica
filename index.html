<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medidas de Longitud - Práctica</title>
  <style>
    :root {
      --primary: #2a9d90;
      --primary-hover: #218277;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2b2d42;
      --border: #e0e0e0;
      --success: #2e7d32;
      --error: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 550px;
      width: 100%;
      padding: 25px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    p.subtitle {
      text-align: center;
      color: #6c757d;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e9ecef;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Conversor */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input, select {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      min-width: 120px;
    }

    button.btn-main {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button.btn-main:hover {
      background-color: var(--primary-hover);
    }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      background-color: #e8f5e9;
      color: var(--success);
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }

    /* Ejercicios */
    .quiz-card {
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .score-board {
      font-size: 1rem;
      color: #495057;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: var(--text);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .option-btn {
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #f0fdf4;
    }

    .quiz-feedback {
      font-weight: bold;
      min-height: 24px;
      font-size: 1.05rem;
    }

    .quiz-feedback.correct { color: var(--success); }
    .quiz-feedback.incorrect { color: var(--error); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Medidas de Longitud</h1>
    <p class="subtitle">Kilómetros, Metros, Centímetros y Milímetros</p>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('conversor')">Conversor</button>
      <button class="tab-btn" onclick="switchTab('ejercicios')">Ejercicios</button>
    </div>

    <!-- Pestaña 1: Conversor -->
    <div id="tab-conversor" class="tab-content active">
      <div class="input-group">
        <input type="number" id="inputValue" placeholder="Cantidad" value="1" step="any" />
        <select id="fromUnit">
          <option value="km">Kilómetros (km)</option>
          <option value="m" selected>Metros (m)</option>
          <option value="cm">Centímetros (cm)</option>
          <option value="mm">Milímetros (mm)</option>
        </select>
        <select id="toUnit">
          <option value="km">Kilómetros (km)</option>
          <option value="m">Metros (m)</option>
          <option value="cm" selected>Centímetros (cm)</option>
          <option value="mm">Milímetros (mm)</option>
        </select>
      </div>
      <button class="btn-main" onclick="convertir()">Convertir</button>
      <div id="resultBox" class="result-box"></div>
    </div>

    <!-- Pestaña 2: Ejercicios -->
    <div id="tab-ejercicios" class="tab-content">
      <div class="quiz-card">
        <div class="score-board">Aciertos: <span id="score">0</span></div>
        <div class="question-text" id="quizQuestion">Cargando pregunta...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div id="quizFeedback" class="quiz-feedback"></div>
      </div>
    </div>
  </div>

  <script>
    const factors = {
      km: 1000,
      m: 1,
      cm: 0.01,
      mm: 0.001
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'conversor') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-conversor').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-ejercicios').classList.add('active');
        nuevoEjercicio();
      }
    }

    function convertir() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;

      if (isNaN(val)) return;

      const inMeters = val * factors[from];
      const res = inMeters / factors[to];

      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      box.innerText = `${val} ${from} = ${res} ${to}`;
    }

    let correctAnswer = 0;
    let score = 0;
